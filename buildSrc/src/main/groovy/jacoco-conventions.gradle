plugins {
    id 'jacoco'
}

// Configure the jacocoTestReport task
tasks.named('test', Test) {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('check').configure {
        dependsOn tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification)
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.from = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: excludedFromCoverage)
        })
    }

    dependsOn tasks.named('compileJava'), tasks.named('test')
}

    // Optional: Exclude generated classes or DTOs from coverage
    //    afterEvaluate {
    //        classDirectories.setFrom(files(classDirectories.files.collect {
    //            fileTree(dir: it, exclude: [
    //                    "**/DuplicateUserInsertionException.*", // Just an example
    //                    "**/config/*"
    //            ])
    //        }))
    //    }

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.from = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: excludedFromCoverage)
        })
    }

    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                element = 'CLASS'
                minimum = 0.8
            }
            limit {
                counter = 'INSTRUCTION'
                element = 'CLASS'
                minimum = 0.8
            }
        }
    }
}